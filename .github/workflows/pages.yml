# Publish the pages/ folder to GitHub Pages. Runs only when a push to main changes pages/ (or by hand), so a merge
# that does not touch the site does not redeploy it. The site needs no build step: holdouts/build_pages.py writes the
# HTML, and it is committed.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - id: deployment
        uses: actions/deploy-pages@v4
